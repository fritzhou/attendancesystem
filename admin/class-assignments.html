<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Assignments — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header">
      <h1>Class Assignments</h1>
      <p class="page-sub">Links a teacher, subject, and section for one semester. Set the weekly schedule after creating one.</p>
    </div>

    <div class="card form-card">
      <form id="addForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="fieldSemester">Semester</label>
            <select id="fieldSemester"></select>
          </div>
          <div class="form-field">
            <label for="fieldSection">Section</label>
            <select id="fieldSection"></select>
          </div>
          <div class="form-field">
            <label for="fieldSubject">Subject</label>
            <select id="fieldSubject"></select>
          </div>
          <div class="form-field">
            <label for="fieldTeacher">Teacher</label>
            <select id="fieldTeacher"></select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Class Assignment</button>
        </div>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="card">
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Subject</th><th>Section</th><th>Teacher</th><th>Semester</th><th>Actions</th></tr></thead>
          <tbody id="assignmentsBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initClassAssignmentsPage } from '../js/class-assignments.js';

  const profile = await requireRole(['admin']);
  if (profile) {
    renderShell(profile);
    initClassAssignmentsPage();
  }
</script>

</body>
</html>
