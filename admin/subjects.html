<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header">
      <h1>Subjects</h1>
      <p class="page-sub">Subjects get linked to a teacher and section in Class Assignments.</p>
    </div>

    <div class="card form-card">
      <form id="addForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="fieldCode">Subject Code</label>
            <input type="text" id="fieldCode" placeholder="PROG2" required>
          </div>
          <div class="form-field">
            <label for="fieldName">Subject Name</label>
            <input type="text" id="fieldName" placeholder="Programming 2" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Subject</button>
        </div>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="card">
      <table class="data-table">
        <thead><tr><th>Code</th><th>Name</th><th>Actions</th></tr></thead>
        <tbody id="subjectsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initSubjectsPage } from '../js/subjects.js';

  const profile = await requireRole(['admin']);
  if (profile) {
    renderShell(profile);
    initSubjectsPage();
  }
</script>

</body>
</html>
