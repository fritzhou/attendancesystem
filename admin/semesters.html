<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semesters — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header">
      <h1>Semesters</h1>
      <p class="page-sub">Each semester belongs to a school year, and holds Prelim/Midterm/Finals periods.</p>
    </div>

    <div class="card form-card">
      <form id="addForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="fieldYear">School Year</label>
            <select id="fieldYear"></select>
          </div>
          <div class="form-field">
            <label for="fieldName">Name</label>
            <select id="fieldName">
              <option value="First Semester">First Semester</option>
              <option value="Second Semester">Second Semester</option>
            </select>
          </div>
          <div class="form-field">
            <label for="fieldStart">Start Date</label>
            <input type="date" id="fieldStart" required>
          </div>
          <div class="form-field">
            <label for="fieldEnd">End Date</label>
            <input type="date" id="fieldEnd" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Semester</button>
        </div>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="card">
      <table class="data-table">
        <thead><tr><th>School Year</th><th>Semester</th><th>Range</th><th>Actions</th></tr></thead>
        <tbody id="semestersBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initSemestersPage } from '../js/semesters.js';

  const profile = await requireRole(['admin']);
  if (profile) {
    renderShell(profile);
    initSemestersPage();
  }
</script>

</body>
</html>
