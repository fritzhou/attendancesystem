<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Periods — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header">
      <h1>Academic Periods</h1>
      <p class="page-sub">Prelim, Midterm, Finals — attendance sessions automatically fall into whichever period matches their date.</p>
    </div>

    <div class="card form-card">
      <form id="addForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="fieldSemester">Semester</label>
            <select id="fieldSemester"></select>
          </div>
          <div class="form-field">
            <label for="fieldName">Period Name</label>
            <input type="text" id="fieldName" list="periodPresets" placeholder="PRELIM">
            <datalist id="periodPresets">
              <option value="PRELIM">
              <option value="MIDTERM">
              <option value="FINALS">
            </datalist>
          </div>
          <div class="form-field">
            <label for="fieldStart">Start Date</label>
            <input type="date" id="fieldStart" required>
          </div>
          <div class="form-field">
            <label for="fieldEnd">End Date</label>
            <input type="date" id="fieldEnd" required>
          </div>
          <div class="form-field">
            <label for="fieldOrder">Sort Order</label>
            <input type="number" id="fieldOrder" value="1" min="1">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Academic Period</button>
        </div>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="card">
      <table class="data-table">
        <thead><tr><th>Semester</th><th>Period</th><th>Range</th><th>Order</th><th>Actions</th></tr></thead>
        <tbody id="periodsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initAcademicPeriodsPage } from '../js/academic-periods.js';

  const profile = await requireRole(['admin']);
  if (profile) {
    renderShell(profile);
    initAcademicPeriodsPage();
  }
</script>

</body>
</html>
