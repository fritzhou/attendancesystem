<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header">
      <h1>Teachers</h1>
      <p class="page-sub">Creates a login the teacher can use immediately — share the email and password with them directly.</p>
    </div>

    <div class="card form-card">
      <form id="addForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="fieldName">Full Name</label>
            <input type="text" id="fieldName" required>
          </div>
          <div class="form-field">
            <label for="fieldEmail">Email</label>
            <input type="email" id="fieldEmail" required>
          </div>
          <div class="form-field">
            <label for="fieldPassword">Temporary Password</label>
            <input type="text" id="fieldPassword" minlength="8" required placeholder="At least 8 characters">
          </div>
          <div class="form-field">
            <label for="fieldEmployeeNumber">Employee Number (optional)</label>
            <input type="text" id="fieldEmployeeNumber">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Teacher</button>
        </div>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="card">
      <table class="data-table">
        <thead><tr><th>Name</th><th>Email</th><th>Employee #</th><th>Status</th></tr></thead>
        <tbody id="teachersBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initTeachersPage } from '../js/teachers.js';

  const profile = await requireRole(['admin']);
  if (profile) {
    renderShell(profile);
    initTeachersPage();
  }
</script>

</body>
</html>
