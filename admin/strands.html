<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strands — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header">
      <h1>Strands</h1>
      <p class="page-sub">Academic strands (e.g. TVL-ICT, STEM, HUMSS) used when creating sections.</p>
    </div>

    <div class="card form-card">
      <form id="addForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="fieldCode">Code</label>
            <input type="text" id="fieldCode" placeholder="TVL-ICT" required>
          </div>
          <div class="form-field">
            <label for="fieldName">Full Name</label>
            <input type="text" id="fieldName" placeholder="Technical-Vocational-Livelihood ICT" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Strand</button>
        </div>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="card">
      <table class="data-table">
        <thead><tr><th>Code</th><th>Name</th><th>Actions</th></tr></thead>
        <tbody id="strandsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initStrandsPage } from '../js/strands.js';

  const profile = await requireRole(['admin']);
  if (profile) {
    renderShell(profile);
    initStrandsPage();
  }
</script>

</body>
</html>
