<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take Attendance — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header">
      <h1>Take Attendance</h1>
      <p class="page-sub">Start or continue attendance for any of your classes.</p>
    </div>

    <div class="card" id="attendanceList"><div class="empty-state">Loading...</div></div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initTeacherAttendancePage } from '../js/teacher-attendance.js';

  const profile = await requireRole(['teacher']);
  if (profile) {
    renderShell(profile);
    initTeacherAttendancePage(profile);
  }
</script>

</body>
</html>
