<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Pilgrim Attend</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/reports.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

<aside id="sidebar"></aside>
<div id="app">
  <header id="topbar"></header>
  <main id="content">
    <div class="page-header no-print">
      <h1>Reports</h1>
      <p class="page-sub">Pick one of your classes, a report type, and a date range.</p>
    </div>

    <div class="card form-card no-print">
      <div class="form-grid">
        <div class="form-field">
          <label for="fieldClass">Class</label>
          <select id="fieldClass"></select>
        </div>
        <div class="form-field">
          <label for="fieldViewMode">Report Type</label>
          <select id="fieldViewMode">
            <option value="daily">Class Attendance Log (Daily Detail)</option>
            <option value="summary">Period Summary</option>
            <option value="semester">Semester Summary</option>
          </select>
        </div>
        <div id="dateRangeFields" style="display:contents;">
          <div class="form-field">
            <label for="fieldPeriod">Quick Range</label>
            <select id="fieldPeriod"><option value="">Custom Date Range</option></select>
          </div>
          <div class="form-field">
            <label for="fieldStart">Start Date</label>
            <input type="date" id="fieldStart">
          </div>
          <div class="form-field">
            <label for="fieldEnd">End Date</label>
            <input type="date" id="fieldEnd">
          </div>
        </div>
      </div>
      <div class="form-field checkbox-field" id="absenceOnlyField" style="margin-top:12px;">
        <input type="checkbox" id="fieldAbsenceOnly">
        <label for="fieldAbsenceOnly" style="margin:0;">Only show students with Absences or Late marks (sorted worst first)</label>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="generateBtn" type="button">Generate Report</button>
      </div>
      <div class="form-error" id="reportError"></div>
    </div>

    <div class="card" id="reportArea" style="display:none;">
      <div class="report-toolbar no-print">
        <button class="btn btn-primary" id="printBtn" type="button">Print</button>
        <button class="btn btn-secondary" id="csvBtn" type="button">Export CSV</button>
        <button class="btn btn-secondary" id="xlsxBtn" type="button">Export Excel</button>
      </div>

      <div class="report-print-header">
        <div class="school-name">Pilgrim Christian College</div>
        <div class="sub-line">Senior High School</div>
        <h2>CLASS ATTENDANCE RECORD</h2>
      </div>

      <div class="report-meta" id="printHeaderMeta"></div>

      <div class="report-table-wrap">
        <table class="report-table" id="reportTable"></table>
      </div>

      <div class="report-footer">
        <div class="signature-block">
          <div class="signature-line" id="footerTeacherName"></div>
          Subject Teacher
        </div>
        <div class="signature-block">
          <div class="signature-line">&nbsp;</div>
          Authorized Personnel
        </div>
      </div>
      <div class="report-generated-note" id="printFooterMeta"></div>
    </div>
  </main>
</div>

<script type="module">
  import { requireRole } from '../js/permissions.js';
  import { renderShell } from '../js/layout.js';
  import { initReportsPage } from '../js/reports.js';

  const profile = await requireRole(['teacher']);
  if (profile) {
    renderShell(profile);
    initReportsPage(profile);
  }
</script>

</body>
</html>
